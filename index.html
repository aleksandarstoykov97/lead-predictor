<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeadPredictor campaign forecast calculator" />
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="settings-panel" aria-label="Campaign settings">
        <a class="brand" href="#top" aria-label="LeadPredictor home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5c0 .6-.22 1.18-.62 1.63L15 13.2v4.55a1 1 0 0 1-.54.89l-3 1.5A1 1 0 0 1 10 19.25V13.2L4.62 7.13A2.45 2.45 0 0 1 3 5.5Z"/></svg></span>Lead<span>Predictor</span></a>

        <form id="forecast-form">
          <div class="field">
            <label for="language">Language</label>
            <select id="language" name="language"><option>🇺🇸&nbsp; English</option><option>🇧🇬&nbsp; Bulgarian</option></select><span class="select-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></span>
          </div>
          <div class="field">
            <label for="currency">Currency</label>
            <select id="currency" name="currency"><option value="USD">$&nbsp; US Dollar</option><option value="EUR">€&nbsp; Euro</option><option value="BGN">лв.&nbsp; Bulgarian Lev</option></select><span class="select-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></span>
          </div>
          <div class="field date-field"><label for="start-date">Campaign Start</label><input id="start-date" type="date" value="2026-05-08" /><span class="date-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span></div>
          <div class="field date-field"><label for="end-date">Campaign End</label><input id="end-date" type="date" value="2026-11-04" /><span class="date-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span></div>
          <p class="campaign-length" id="campaign-length" aria-live="polite">Campaign duration: 180 days</p>
          <div class="field money-field"><label for="revenue">Total Revenue</label><span class="currency-sign">$</span><input id="revenue" type="number" min="0" step="100" value="10000" /></div>
          <div class="field money-field"><label for="order-value">Avg. Order Value</label><span class="currency-sign">$</span><input id="order-value" type="number" min="1" step="10" value="1000" /></div>
        </form>
      </aside>

      <section class="workspace" id="top">
        <section class="forecast-card" aria-label="Campaign forecast">
          <div class="chart-wrap">
            <div class="chart-title"><h1>Campaign forecast</h1><p>Hover a bar to view the projected prospects.</p></div>
            <div class="chart-plot"><span class="axis-title">Month</span><div id="bar-chart" class="bar-chart" aria-label="Monthly forecast chart"></div></div>
            <div class="chart-head" aria-hidden="true"><span>0 people</span><span>20 people</span><span>40 people</span><span>60 people</span><span>80 people</span><span>100 people</span><span>120 people</span></div>
          </div>
          <section class="metric-list" aria-label="Forecast totals">
            <article class="metric"><div class="metric-title"><span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2.2h6.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/><path d="M3 9h18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><strong>Prospects</strong><b id="prospect-percent">100%</b></div><output id="prospects" aria-live="polite">125</output><div class="progress" role="progressbar" aria-label="Prospects"><i id="prospects-progress"></i></div></article>
            <article class="metric"><div class="metric-title"><span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0Z"/></svg></span><strong>Leads</strong><b id="lead-percent">20%</b></div><output id="leads" aria-live="polite">25</output><div class="progress" role="progressbar" aria-label="Leads"><i id="leads-progress"></i></div></article>
            <article class="metric"><div class="metric-title"><span class="metric-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h12v5.5A6 6 0 0 1 13 15.4V18h3v2H8v-2h3v-2.6A6 6 0 0 1 6 9.5Z"/><path d="M6 6H3v1.5A4.5 4.5 0 0 0 7 12M18 6h3v1.5a4.5 4.5 0 0 1-4 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><strong>Customers</strong><b id="customer-percent">8%</b></div><output id="customers" aria-live="polite">10</output><div class="progress" role="progressbar" aria-label="Customers"><i id="customers-progress"></i></div></article>
          </section>
        </section>

        <section class="rates-card" aria-label="Response rate controls">
          <div class="range-row"><label for="lead-rate">Lead Response Rate</label><input id="lead-rate" type="range" min="5" max="100" value="40" /><output id="lead-rate-value">40.00%</output></div>
          <div class="range-row"><label for="prospect-rate">Prospect Response Rate</label><input id="prospect-rate" type="range" min="5" max="100" value="20" /><output id="prospect-rate-value">20.00%</output></div>
        </section>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
